[project]
name = "catchup-backend"
version = "0.1.0"
description = "Catch-Up: AI-powered friend meetup organizer"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",       # Server-Sent Events for negotiation stream
    
    # Google AI
    "google-adk>=1.0.0",          # Agent Development Kit
    "google-cloud-aiplatform",     # Vertex AI / Gemini
    
    # Voice (Gradium)
    "gradbot",                     # Gradbot voice agent framework
    
    # Search
    "tavily-python>=0.5.0",        # Tavily web search for venues
    
    # Data
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # DB & Auth
    "supabase>=2.0.0",
    
    # HTTP
    "httpx>=0.27.0",
    
    # Google Calendar
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    
    # Logging
    "structlog>=24.0.0",
    
    # Utils
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx",  # for TestClient
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
