server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown path falls back to index.html so React
    # Router can resolve client-side routes like /onboarding/welcome.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets, never cache the entry HTML.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Make sure cross-origin loading from same-origin works for Web Workers
    # (Gradbot voice client). Same-origin only, so this is a no-op for our
    # frontend itself but documents intent.
    add_header Cross-Origin-Resource-Policy "cross-origin";

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
